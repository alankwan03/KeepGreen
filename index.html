<!DOCTYPE html>
<html lang="en" class="w-full max-w-full overflow-x-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KeepGreen - Plant Care & Watering Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23059669' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m7 20 5-10m0 0 5 10m-5-10v10'/><path d='M12 10a5 5 0 0 0-5-5H5v2a5 5 0 0 0 5 5'/><path d='M12 7a5 5 0 0 1 5-5h2v2a5 5 0 0 1-5 5'/></svg>" />

  <!-- Global Viewport & Overflow Locks -->
  <style>
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      position: relative;
      touch-action: pan-y;
      -webkit-text-size-adjust: 100%;
    }
    #root {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }
  </style>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.2s ease-out forwards',
            'slide-up': 'slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.98)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(100%)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    };
  </script>

  <!-- React 18, React DOM & Babel Standalone -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased selection:bg-emerald-500 selection:text-white w-full max-w-full overflow-x-hidden min-h-screen">
  <div id="root" class="w-full max-w-full overflow-x-hidden min-h-screen"></div>

  <!-- Application Bundle -->
  <script type="text/babel" src="./app.bundle.js"></script>
</body>
</html>
